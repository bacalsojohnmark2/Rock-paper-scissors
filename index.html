<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors, Lizard, Spock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-card">
        <div class="header">
            <h1>Rock, Paper, Scissors, Lizard, Spock</h1>
        </div>

        <div class="scoreboard">
            <div class="score-box">
                <span class="label">PLAYER</span>
                <span id="player-score" class="score">0</span>
            </div>
            <div class="vs-badge">VS</div>
            <div class="score-box">
                <span class="label">COMPUTER</span>
                <span id="computer-score" class="score">0</span>
            </div>
        </div>

        <div class="arena">
            <div id="player-choice-display" class="choice-circle placeholder">❓</div>
            <div class="vs-divider">VS</div>
            <div id="computer-choice-display" class="choice-circle placeholder">❓</div>
        </div>

        <div id="result-message" class="result-message">Choose your move!</div>

        <div class="choices-container">
            <button class="choice-btn rock" data-choice="rock" title="Rock">✊</button>
            <button class="choice-btn paper" data-choice="paper" title="Paper">✋</button>
            <button class="choice-btn scissors" data-choice="scissors" title="Scissors">✌️</button>
            <button class="choice-btn lizard" data-choice="lizard" title="Lizard">🦎</button>
            <button class="choice-btn spock" data-choice="spock" title="Spock">🖖</button>
        </div>

        <div class="concept-box">
            <p><strong>Concept:</strong> Play the classic game with 5 choices, track score, and show results with animations.</p>
        </div>

        <button id="reset-btn" class="reset-btn">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
